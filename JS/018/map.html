<body>
    
    <script>

        var salaries = [100, 200, 300];
        console.log(salaries);
        var doubleSalaries = salaries.map(el => el * 2);
        //[200, 400, 600]
        console.log(doubleSalaries);

        var tripleSalaries = salaries.map(el => {
            return el * 3;
        });
        console.log(tripleSalaries);


    </script>

</body>
