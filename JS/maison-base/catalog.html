<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catálogo — Maison Canine</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="catalog">
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">Maison Canine</a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="catalog.html" aria-current="page">Catálogo</a>
        <a href="cart.html">Carrinho</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h1 class="h2">Catálogo</h1>
        <p class="muted">
          Filtros por URL (sem eventos). Exemplos:
          <code>catalog.html?category=coleira&color=camel&sort=priceAsc</code>
        </p>
      </div>

      <div class="card">
        <div class="filters">
          <div>
            <div class="label">Filtros aplicados</div>
            <div id="filtersSummary" class="muted"></div>
          </div>
          <div class="right">
            <div class="label">Resultados</div>
            <div id="resultsCount" class="muted"></div>
          </div>
        </div>
      </div>

      <div id="catalogGrid" class="grid grid-4 section"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <div class="muted">Dica: muda os query params e recarrega a página.</div>
      <div class="footer-links">
        <a href="catalog.html?inStock=true">Em stock</a>
        <a href="catalog.html?category=trela">Só trelas</a>
        <a href="catalog.html?sort=ratingDesc">Top rating</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
