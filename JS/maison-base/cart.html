<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrinho — Maison Canine</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="cart">
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">Maison Canine</a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="catalog.html">Catálogo</a>
        <a href="cart.html" aria-current="page">Carrinho</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h1 class="h2">Carrinho (modo demo)</h1>
        <p class="muted">Itens vêm do array <code>CART</code> em <code>data.js</code>.</p>
      </div>

      <div class="grid grid-3">
        <div class="card span-2">
          <h2 class="h3">Itens</h2>
          <div id="cartList" class="cart-list"></div>
        </div>

        <aside class="card">
          <h2 class="h3">Resumo</h2>
          <div id="cartSummary" class="summary"></div>

          <div class="divider"></div>
          <p class="muted">
            Desconto via URL (ex.): <code>cart.html?code=WELCOME10</code>
          </p>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <div class="muted">Regras: envio e desconto calculados em JS.</div>
      <div class="footer-links">
        <a href="cart.html?code=WELCOME10">WELCOME10</a>
        <a href="cart.html?code=FREESHIP">FREESHIP</a>
        <a href="cart.html">Sem código</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
