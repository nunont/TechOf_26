<!DOCTYPE html>

<body>

    <script>
        const findMaxInArray = (arr) => {
            let max = 0;
            for(let i = 0; i < arr.length; i++){
                if (arr[i] > max){
                    max = arr[i];
                }
            }

            return max;

            /* return Math.max(...arr); */
        }
        const numbers = [1, 6, 25, 2, 9];
        let max = findMaxInArray(numbers);
        console.log("Max", max);

        

    </script>
    
</body>
</html>
