<html>

<body>

    <h1>Please add friends 💞</h1>

    <input type="text" id="friend" placeholder="add friend">

    <button onclick="addFriend()">Add friend</button>

    <ul id="myFriends"></ul>

    <script>

        function addFriend() {
            let input = document.getElementById('friend');

            if (input.value == ''){
                return;
            }

            let newItem = document.createElement('li')
            newItem.innerText = input.value;

            document.getElementById('myFriends').appendChild(newItem);

            input.value = '';
        }

    </script>

</body>

</html>
