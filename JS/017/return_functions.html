<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        function mult(a, b) {
            return a * b;
        }

        function by2(a) {
            return mult(a, 2);
        }

        function by9(a) {
            return mult(a, 9);
        }

        console.log(by2(12));
        console.log(mult(45, 3));
        console.log(by9(1));

    </script>
    
</body>
</html>
